<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Obsidian dark squircle container -->
  <rect width="128" height="128" rx="30" fill="#08090e"/>
  <rect x="3" y="3" width="122" height="122" rx="27" stroke="#f97316" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="6" y="6" width="116" height="116" rx="24" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- LL Monogram centered -->
  <g transform="translate(-15, 12) scale(0.125)">
    <!-- Left L -->
    <path d="
      M 315 590
      L 445 150
      Q 455 115 495 115
      L 620 115
      L 620 118
      Q 570 145 558 190
      L 475 545
      Q 468 575 500 575
      L 570 575
      Q 565 605 525 610
      Z"
      fill="url(#llLeft)"
      stroke="#fb923c"
      stroke-width="16"
      stroke-linejoin="round"
    />

    <!-- Right L -->
    <path d="
      M 510 670
      L 645 280
      Q 657 245 697 245
      L 835 245
      L 835 248
      Q 785 275 773 320
      L 690 655
      Q 683 690 720 690
      L 950 690
      Q 940 720 900 720
      L 525 720
      Z"
      fill="url(#llRight)"
      stroke="#f97316"
      stroke-width="16"
      stroke-linejoin="round"
    />
  </g>

  <defs>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="llLeft" x1="315" y1="115" x2="620" y2="610" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="llRight" x1="510" y1="245" x2="950" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
</svg>
